<!doctype html>
<html lang="en">
<head>

<title>tumanguya — fueling</title>
<link rel="icon" href="/static/icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --light:     #f1f2ec;
    --lightgray: #dfe1d7;
    --gray:      #969a8c;
    --darkgray:  #42423a;
    --dark:      #2a2b25;
    --secondary: #4a7c74;
    --tertiary:  #7d9b8e;
    --highlight: rgba(122, 143, 122, 0.12);

    --f-body: "Atkinson Hyperlegible Next", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    background: var(--light);
    color: var(--darkgray);
    font-family: var(--f-body);
    font-weight: 400;
    font-size: 16.5px;
    line-height: 1.6;
    margin: 0;
    padding: 0 22px 96px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 750px; margin: 0 auto; }
  [hidden] { display: none !important; }

  /* ---------- gate ---------- */
  #gate {
    max-width: 420px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
  }
  #gate h1 {
    font-family: var(--f-body);
    font-weight: 600;
    font-size: 26px;
    color: var(--dark);
    margin: 0;
    letter-spacing: -0.01em;
  }
  #gate p { margin: 0; color: var(--gray); font-size: 15px; }
  #gate form { display: flex; gap: 8px; margin-top: 4px; }
  #gate input {
    flex: 1;
    font-family: var(--f-mono);
    font-size: 15px;
    padding: 11px 13px;
    color: var(--dark);
    background: #fff;
    border: 1px solid var(--lightgray);
    border-radius: 5px;
  }
  #gate input:focus { outline: 2px solid var(--secondary); outline-offset: 1px; }
  #gate button {
    font-family: var(--f-body);
    font-weight: 600;
    font-size: 15px;
    padding: 11px 20px;
    color: var(--light);
    background: var(--secondary);
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }
  #gate button:hover { background: var(--tertiary); }
  #gate button[disabled] { opacity: 0.55; cursor: default; }
  #msg { font-size: 14px; color: var(--gray); min-height: 20px; margin: 0; }
  #msg.bad { color: #9c5b4e; }

  /* ---------- content ---------- */
  .masthead { padding: 60px 0 26px; border-bottom: 1px solid var(--lightgray); }
  .eyebrow {
    font-family: var(--f-mono);
    font-size: 12px;
    letter-spacing: 0.09em;
    color: var(--gray);
    margin: 0 0 12px;
  }
  h1 {
    font-family: var(--f-body);
    font-weight: 600;
    font-size: clamp(34px, 7vw, 50px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    color: var(--dark);
    text-wrap: balance;
    margin: 0 0 14px;
  }
  .standfirst { font-size: 17px; color: var(--gray); max-width: 56ch; margin: 0; }

  .profile {
    margin-top: 28px;
    border: 1px solid var(--lightgray);
    border-radius: 6px;
    background: #fff;
    padding: 16px 6px 8px;
    overflow-x: auto;
  }
  .profile svg { display: block; width: 100%; min-width: 520px; height: auto; }
  .profile text { font-family: var(--f-mono); font-size: 10px; fill: var(--gray); }
  .profile text.day { font-size: 10px; fill: var(--darkgray); letter-spacing: 0.06em; }

  section { margin-top: 50px; }
  h2 {
    font-family: var(--f-body);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gray);
    margin: 0 0 20px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--lightgray);
  }
  h3 {
    font-family: var(--f-body);
    font-weight: 600;
    font-size: 20px;
    color: var(--dark);
    margin: 0;
    text-wrap: balance;
  }
  p { margin: 0; }
  .lede { color: var(--gray); font-size: 15px; margin-bottom: 16px; }
  ul { padding-left: 1.15em; margin: 0; display: flex; flex-direction: column; gap: 7px; }
  li::marker { color: var(--tertiary); }
  b, strong { color: var(--dark); font-weight: 600; }

  .rules { display: flex; flex-direction: column; gap: 14px; }
  .rule { display: grid; grid-template-columns: 24px 1fr; gap: 14px; align-items: start; }
  .rule .n { font-family: var(--f-mono); font-size: 12px; color: var(--tertiary); padding-top: 5px; }

  .day {
    background: #fff;
    border: 1px solid var(--lightgray);
    border-left: 3px solid var(--tertiary);
    border-radius: 6px;
    padding: 20px 22px 22px;
    margin-bottom: 14px;
  }
  .day.summit { border-left-color: var(--secondary); }
  .day-head {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px;
    padding-bottom: 13px; margin-bottom: 15px;
    border-bottom: 1px solid var(--lightgray);
  }
  .date {
    font-family: var(--f-mono); font-size: 11.5px; letter-spacing: 0.05em;
    color: var(--gray); flex-basis: 100%;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 7px; margin-left: auto; }
  .badge {
    font-family: var(--f-mono); font-size: 11.5px; font-variant-numeric: tabular-nums;
    padding: 3px 9px; border-radius: 4px;
    background: var(--highlight); color: var(--darkgray); white-space: nowrap;
  }
  .badge.key { background: var(--secondary); color: var(--light); }
  .day-body { display: flex; flex-direction: column; gap: 14px; }
  .meal { display: grid; grid-template-columns: 104px 1fr; gap: 5px 18px; }
  .meal .when {
    font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.03em;
    color: var(--secondary); padding-top: 3px;
  }
  .meal .what { font-size: 15.5px; }
  .kcal {
    font-family: var(--f-mono); font-size: 12.5px; color: var(--gray);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 560px) {
    .meal { grid-template-columns: 1fr; gap: 1px; }
    .badges { margin-left: 0; }
  }

  .timeline { display: flex; flex-direction: column; }
  .tl { display: grid; grid-template-columns: 58px 1fr; gap: 18px; padding-bottom: 17px; position: relative; }
  .tl::before {
    content: ""; position: absolute; left: 67px; top: 9px; bottom: -8px;
    width: 1px; background: var(--lightgray);
  }
  .tl:last-child::before { display: none; }
  .tl .clock {
    font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums;
    color: var(--dark); text-align: right; position: relative;
  }
  .tl .clock::after {
    content: ""; position: absolute; right: -13px; top: 7px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--secondary);
  }
  .tl .ev b { display: block; font-weight: 600; color: var(--dark); }
  .tl .ev span { font-size: 15.5px; }

  .scroll { overflow-x: auto; border: 1px solid var(--lightgray); border-radius: 6px; background: #fff; }
  table { border-collapse: collapse; width: 100%; min-width: 460px; }
  th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--lightgray); font-size: 14.5px; }
  th {
    font-family: var(--f-body); font-weight: 600; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--gray); background: var(--highlight); white-space: nowrap;
  }
  td.num, th.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; }
  tbody tr:last-child td { border-bottom: none; }
  tfoot td {
    font-family: var(--f-mono); background: var(--highlight);
    border-top: 1px solid var(--gray); border-bottom: none; color: var(--dark);
  }

  .stack { display: flex; flex-direction: column; gap: 15px; }
  .note {
    background: #fff; border: 1px solid var(--lightgray);
    border-top: 3px solid var(--tertiary); border-radius: 6px; padding: 19px 21px;
  }
  .note.warn { border-top-color: var(--secondary); }
  .note h3 { font-size: 17px; margin-bottom: 12px; }

  footer {
    margin-top: 52px; padding-top: 18px; border-top: 1px solid var(--lightgray);
    font-size: 14px; color: var(--gray);
  }
  a { color: var(--secondary); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  function b64(s) {
    var raw = atob(s), a = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) a[i] = raw.charCodeAt(i);
    return a;
  }

  var f = document.getElementById("f");
  var pw = document.getElementById("pw");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");

  f.addEventListener("submit", async function (e) {
    e.preventDefault();
    var word = pw.value.trim();
    if (!word) return;
    go.disabled = true;
    msg.className = "";
    msg.textContent = "checking…";
    try {
      var enc = new TextEncoder();
      var km = await crypto.subtle.importKey("raw", enc.encode(word), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
        km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
      );
      var plain = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.ct)
      );
      var html = new TextDecoder().decode(plain);
      document.getElementById("content").innerHTML = html;
      document.getElementById("content").hidden = false;
      document.getElementById("gate").hidden = true;
      document.title = "tumanguya — fueling";
      window.scrollTo(0, 0);
    } catch (err) {
      msg.className = "bad";
      msg.textContent = "That keyword doesn't open this page.";
      pw.value = "";
      pw.focus();
    } finally {
      go.disabled = false;
    }
  });

  pw.focus();
})();
</script>
